# Korea Mail Club — static export (`npm run build` → out/).
#
# Same pattern as Clínica / Personal: Traefik terminates HTTPS and forwards to this Nginx container,
# which serves the uploaded out/. No Node.js in production. Proposed config for the first setup;
# once live, keep this file in sync with /opt/apps/korea-mail/nginx/default.conf on the VPS.

server {
    listen 80;
    server_name _;   # Host is matched by the Traefik router; set the real domain here once chosen.

    root /usr/share/nginx/site/current;
    index index.html;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/xml application/javascript application/json application/xml image/svg+xml;

    # Share preview image is exported without an extension: serve it as PNG, before the slash rewrite.
    location = /opengraph-image {
        default_type image/png;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Confirmation landing page (MailerLite double opt-in redirect): never indexed.
    location ^~ /welcome {
        add_header X-Robots-Tag "noindex" always;
        rewrite ^/welcome$ /welcome/ permanent;
        try_files $uri $uri/index.html =404;
    }

    location ^~ /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        rewrite ^([^.]*[^/])$ $1/ permanent;   # /privacy → /privacy/ (trailingSlash: true)
        try_files $uri $uri/index.html =404;
    }

    location ~ /\. {
        return 404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
